[project]
name = "agentic-kg-rag"
version = "0.1.0"
description = "A lightweight Agentic KG-RAG system for document knowledge construction and question answering."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4",
    "fastapi",
    "gradio",
    "httpx",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph",
    "langsmith",
    "markdownify",
    "neo4j",
    "pydantic-settings",
    "pymupdf",
    "python-docx",
    "python-dotenv",
    "python-multipart",
    "qdrant-client",
    "tavily-python",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
kg-rag-api = "agentic_kg_rag.api:main"
kg-rag-ui = "agentic_kg_rag.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_kg_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
